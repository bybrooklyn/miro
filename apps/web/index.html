<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <title>Miro</title>
    <style>
      /* One stylesheet, no framework: this ships inside the daemon and is read on a phone. */
      :root {
        --bg: #0f1117;
        --panel: #161923;
        --panel-2: #1d2130;
        --line: #262b3a;
        --text: #c6cbd9;
        --dim: #6b7186;
        --bright: #ffffff;
        --accent: #7aa2f7;
        --good: #86c185;
        --warn: #e0af68;
        --bad: #e06c75;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
      body {
        font: 15px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        display: flex; flex-direction: column;
        /* Keep the composer clear of a phone's home bar. */
        padding-bottom: env(safe-area-inset-bottom);
      }
      header {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
        position: sticky; top: 0; z-index: 2;
      }
      header .name { color: var(--bright); font-weight: 600; }
      header .meta { color: var(--dim); font-size: 13px; margin-left: auto; text-align: right; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
      .dot.healthy { background: var(--good); }
      .dot.degraded { background: var(--warn); }
      .dot.connecting { background: var(--dim); animation: pulse 1.2s infinite; }
      @keyframes pulse { 50% { opacity: 0.25; } }
      main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
      .block { max-width: 100%; }
      .user { align-self: flex-end; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px 12px 2px 12px; padding: 8px 12px; color: var(--bright); white-space: pre-wrap; }
      .assistant { white-space: pre-wrap; }
      .assistant.streaming::after { content: "▍"; color: var(--accent); }
      .activity, .notice, .operation, .plan { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 10px 12px; }
      .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
      .notice.warn { border-color: #4a3a1f; }
      .notice.credential { border-color: #3a2f4a; }
      .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 14px; }
      .kv dt { color: var(--dim); }
      .kv dd { margin: 0; overflow-wrap: anywhere; }
      pre.compose { margin: 8px 0 0; padding: 8px; background: #0c0e14; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-size: 13px; }
      ul.steps { margin: 4px 0 0; padding-left: 18px; }
      .phase { color: var(--accent); font-size: 13px; }
      .outcome.committed { color: var(--good); }
      .outcome.rolledback { color: var(--bad); }
      .outcome.applied_unverified { color: var(--warn); }
      footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px; }
      .prompt { margin-bottom: 10px; }
      .prompt .q { color: var(--bright); margin-bottom: 8px; white-space: pre-wrap; }
      .options { display: flex; flex-wrap: wrap; gap: 8px; }
      button {
        font: inherit; color: var(--text); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer;
        /* A real tap target on a phone. */
        min-height: 44px;
      }
      button:hover { border-color: var(--accent); color: var(--bright); }
      button.primary { border-color: var(--accent); color: var(--bright); }
      button.danger:hover { border-color: var(--bad); }
      form.composer { display: flex; gap: 8px; }
      input, textarea {
        font: inherit; flex: 1; color: var(--bright); background: #0c0e14;
        border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px;
      }
      input:focus, textarea:focus { outline: none; border-color: var(--accent); }
      .center { margin: auto; max-width: 420px; padding: 24px; text-align: center; }
      .center h1 { color: var(--bright); font-size: 20px; }
      .center p { color: var(--dim); }
      .err { color: var(--bad); min-height: 1.5em; }
      .working { color: var(--dim); font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
