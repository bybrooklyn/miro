<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Miro</title>
    <style>
      /* Terminal-flavoured, done deliberately: monospace throughout, but with a real scale, hairlines
         instead of grey boxes, one accent, and colour reserved for state. Sized to survive being read on
         a phone held at arm's length at 2am. */
      :root {
        --bg: #0b0d12;
        --raised: #11141b;
        --line: #1e2330;
        --line-soft: #171b25;
        --text: #b8c0d0;
        --bright: #e8ecf4;
        --dim: #5f6879;
        --accent: #7aa2f7;
        --good: #7fbf7f;
        --warn: #d7a45f;
        --bad: #d97a7a;

        --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        --step-0: 14px;      /* body */
        --step--1: 12px;     /* labels, meta */
        --step-1: 16px;      /* section heads */
        --step-2: 19px;      /* screen titles */
        --measure: 74ch;     /* prose stops here even on a wide screen */
        --gutter: 20px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      /* React mounts the app inside #root, so IT is body's only flex child. Without this, the
         header/main/footer inside it are ordinary blocks and nothing stretches - the composer floats
         under the header with the page empty below it. */
      #root { display: flex; flex-direction: column; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: var(--step-0)/1.65 var(--mono);
        font-variant-ligatures: none;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
      }
      ::selection { background: #24304a; color: var(--bright); }

      /* ---------- chrome ---------- */
      header {
        display: flex; align-items: center; gap: 14px;
        padding: 12px var(--gutter);
        border-bottom: 1px solid var(--line);
        position: sticky; top: 0; z-index: 3; background: var(--bg);
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
      .dot.healthy { background: var(--good); box-shadow: 0 0 8px #7fbf7f55; }
      .dot.degraded { background: var(--warn); }
      .dot.connecting { background: var(--dim); animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.2; } }
      header .name { color: var(--bright); letter-spacing: 0.02em; }
      header .meta {
        margin-left: auto; color: var(--dim); font-size: var(--step--1);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      nav.tabs { display: flex; gap: 2px; }
      nav.tabs button {
        font: inherit; font-size: var(--step--1); letter-spacing: 0.08em; text-transform: uppercase;
        background: none; border: 0; border-bottom: 1px solid transparent;
        color: var(--dim); padding: 4px 8px; cursor: pointer; min-height: 0;
      }
      nav.tabs button:hover { color: var(--text); }
      nav.tabs button.on { color: var(--bright); border-bottom-color: var(--accent); }

      main {
        flex: 1; overflow-y: auto; overscroll-behavior: contain;
        padding: 22px var(--gutter) 8px;
        display: flex; flex-direction: column; gap: 20px;
      }
      /* The column lines up with the header and the prompt caret, rather than floating in the
         middle of a wide window with the chrome stuck to the left edge. */
      main > * { width: 100%; max-width: var(--measure); }
      /* A bare button in the column is a control, not a block: it should hug its label at the gutter
         rather than stretch and centre its text. */
      main > button { width: auto; align-self: flex-start; }

      /* ---------- transcript ---------- */
      .turn-user { color: var(--bright); display: flex; gap: 10px; }
      .turn-user::before { content: "›"; color: var(--accent); flex: none; }
      .assistant { color: var(--text); }
      .assistant > div + div { margin-top: 0.85em; }
      .assistant p { margin: 0; }
      .assistant h1, .assistant h2, .assistant h3, .assistant h4, .assistant h5, .assistant h6 {
        margin: 0; color: var(--bright); font-size: var(--step-1); font-weight: 600; letter-spacing: 0.01em;
      }
      .assistant h3, .assistant h4, .assistant h5, .assistant h6 { font-size: var(--step-0); }
      .assistant strong { color: var(--bright); font-weight: 600; }
      .assistant em { color: var(--text); font-style: italic; }
      .assistant a { color: var(--accent); text-underline-offset: 3px; }
      .assistant ul, .assistant ol { margin: 0; padding-left: 1.4em; }
      .assistant li { margin: 0.15em 0; }
      .assistant li::marker { color: var(--dim); }
      .assistant blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--line); color: var(--dim); }
      .assistant hr { border: 0; border-top: 1px solid var(--line); margin: 0.6em 0; }
      code { background: var(--raised); border: 1px solid var(--line-soft); border-radius: 3px; padding: 0 4px; color: var(--bright); }
      pre.code, pre.out {
        margin: 0; padding: 10px 12px; background: var(--raised);
        border: 1px solid var(--line-soft); border-radius: 3px;
        overflow-x: auto; font-size: var(--step--1); line-height: 1.55; color: var(--text);
      }
      pre.code code { background: none; border: 0; padding: 0; }
      .streaming::after { content: "▌"; color: var(--accent); animation: pulse 1.1s steps(2) infinite; }

      /* Activity: one quiet line, expandable. Never a payload. */
      details.activity { color: var(--dim); font-size: var(--step--1); }
      details.activity > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; }
      details.activity > summary::-webkit-details-marker { display: none; }
      details.activity > summary::before { content: "⋯"; color: var(--dim); }
      details.activity[open] > summary::before { content: "⋮"; }
      .tree { margin: 6px 0 0 18px; display: flex; flex-direction: column; gap: 2px; }
      .tree .node { display: flex; gap: 8px; }
      .tree .mark { flex: none; width: 1ch; }
      .tree .running { color: var(--accent); }
      .tree .done { color: var(--good); }
      .tree .failed { color: var(--bad); }
      .tree .detail { color: var(--dim); }

      /* Cards: a hairline and a state-coloured edge, not a grey box. */
      .card { border: 1px solid var(--line); border-left: 2px solid var(--line); border-radius: 3px; padding: 12px 14px; background: var(--raised); }
      .card.pending { border-left-color: var(--accent); }
      .card.committed { border-left-color: var(--good); }
      .card.rolledback { border-left-color: var(--bad); }
      .card.applied_unverified { border-left-color: var(--warn); }
      .card .eyebrow {
        font-size: var(--step--1); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim);
        display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px;
      }
      .card .title { color: var(--bright); }
      .card .sub { color: var(--dim); margin-top: 2px; }
      .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin-top: 10px; font-size: var(--step--1); }
      .facts dt { color: var(--dim); }
      .facts dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
      .card .outcome { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line-soft); font-size: var(--step--1); }
      .outcome.committed { color: var(--good); }
      .outcome.rolledback { color: var(--bad); }
      .outcome.applied_unverified { color: var(--warn); }
      .steps { margin: 4px 0 0; padding-left: 1.3em; font-size: var(--step--1); }
      .steps li::marker { color: var(--dim); }
      .notice { border-left: 2px solid var(--line); padding-left: 12px; font-size: var(--step--1); color: var(--text); }
      .notice.warn { border-left-color: var(--warn); }
      .notice.credential { border-left-color: var(--accent); color: var(--bright); }

      /* ---------- footer: the prompt line ---------- */
      footer { border-top: 1px solid var(--line); background: var(--bg); padding: 12px var(--gutter) 14px; }
      footer > * { width: 100%; max-width: var(--measure); }
      form.composer, form.row { display: flex; align-items: center; gap: 10px; }
      /* The caret marks the prompt line specifically - not every form (the pairing screen is not a prompt). */
      form.composer::before { content: "›"; color: var(--accent); flex: none; }
      input[type="text"], input[type="password"], input:not([type]) {
        font: inherit; flex: 1; min-width: 0; color: var(--bright);
        background: none; border: 0; border-bottom: 1px solid transparent; padding: 6px 0;
        min-height: 40px;
      }
      input::placeholder { color: var(--dim); }
      input:focus { outline: none; border-bottom-color: var(--line); }
      button {
        font: inherit; font-size: var(--step--1); color: var(--text);
        background: none; border: 1px solid var(--line); border-radius: 3px;
        padding: 8px 12px; cursor: pointer; min-height: 40px; white-space: nowrap;
      }
      button:hover { color: var(--bright); border-color: var(--dim); }
      button.primary { color: var(--bright); border-color: var(--accent); }
      button.primary:hover { background: #141a29; }
      button.danger:hover { color: var(--bad); border-color: var(--bad); }
      button:disabled { opacity: 0.4; cursor: default; }
      button.link { border: 0; padding: 4px 0; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; min-height: 0; }
      button.link:hover { color: var(--text); }

      .prompt .q { color: var(--bright); margin-bottom: 10px; }
      .prompt .q .clock { color: var(--warn); }
      .options { display: flex; flex-wrap: wrap; gap: 8px; }
      .hint { color: var(--dim); font-size: var(--step--1); margin-top: 8px; }
      .working { color: var(--dim); font-size: var(--step--1); }
      .working::before { content: "▌"; color: var(--accent); animation: pulse 1.1s steps(2) infinite; margin-right: 8px; }

      /* ---------- stacks ---------- */
      .stack { border-top: 1px solid var(--line); padding: 14px 0; }
      .stack:first-of-type { border-top: 0; }
      .stack .head { display: flex; align-items: baseline; gap: 10px; }
      .stack .app { color: var(--bright); font-size: var(--step-1); }
      .stack .state { font-size: var(--step--1); }
      .stack .state.up { color: var(--good); }
      .stack .state.part { color: var(--warn); }
      .stack .state.down { color: var(--dim); }
      .stack .image { color: var(--dim); font-size: var(--step--1); margin-top: 2px; overflow-wrap: anywhere; }
      .stack .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .logs { margin-top: 10px; max-height: 320px; overflow: auto; }

      /* ---------- centred screens ---------- */
      .screen { flex: 1; display: grid; place-content: center; padding: 40px var(--gutter); }
      .screen .inner { max-width: 42ch; }
      .screen h1 { font-size: var(--step-2); color: var(--bright); font-weight: 600; margin: 0 0 10px; }
      .screen p { color: var(--dim); margin: 0 0 22px; }
      .screen .err { color: var(--bad); min-height: 1.4em; margin-top: 12px; font-size: var(--step--1); }
      input.code { font-size: var(--step-2); letter-spacing: 0.35em; text-align: center; border-bottom: 1px solid var(--line); width: 100%; }
      .empty { color: var(--dim); }

      @media (max-width: 600px) {
        :root { --gutter: 14px; }
        header .meta { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
